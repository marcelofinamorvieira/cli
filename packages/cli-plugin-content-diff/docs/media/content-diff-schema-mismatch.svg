<g class="f35"><text x="18" y="59"><tspan fill="#8cc570" font-weight="700">$ </tspan>npx datocms content:diff "spring launch" --autogenerate=staging</text><text x="18" y="78">Comparing content from "staging" to "main"... FAILED!</text></g>
<g class="f36"><text x="18" y="59"><tspan fill="#8cc570" font-weight="700">$ </tspan>npx datocms content:diff "spring launch" --autogenerate=staging</text><text x="18" y="78">Comparing content from "staging" to "main"... FAILED!</text></g>
<g class="f37"><text x="18" y="59"><tspan fill="#8cc570" font-weight="700">$ </tspan>npx datocms content:diff "spring launch" --autogenerate=staging</text><text x="18" y="78">Comparing content from "staging" to "main"... FAILED!</text><text x="18" y="97"> <tspan fill="#ef6b73">›</tspan>   Error: Incompatible schema: cannot generate content migration "spring launch" from "staging" </text><text x="18" y="116"> <tspan fill="#ef6b73">›</tspan>   to "main" because their managed schemas differ.</text><text x="18" y="135"> <tspan fill="#ef6b73">›</tspan>   No content records were read and no migration artifacts were created.</text><text x="18" y="154"> <tspan fill="#ef6b73">›</tspan>   Generate the schema migration first:</text><text x="18" y="173"> <tspan fill="#ef6b73">›</tspan>     datocms migrations:new "sync staging schema" --autogenerate="staging:main"</text><text x="18" y="192"> <tspan fill="#ef6b73">›</tspan>   Apply it to a fork of the destination:</text><text x="18" y="211"> <tspan fill="#ef6b73">›</tspan>     datocms migrations:run --source="main" --destination="main-schema-ready"</text><text x="18" y="230"> <tspan fill="#ef6b73">›</tspan>   Then regenerate the content diff against that schema-ready fork:</text><text x="18" y="249"> <tspan fill="#ef6b73">›</tspan>     datocms content:diff "spring launch" --autogenerate="staging:main-schema-ready"</text><text x="18" y="268"> <tspan fill="#ef6b73">›</tspan>   --migrate-invalid-content only handles supported invalid or historical-null content; it does </text><text x="18" y="287"> <tspan fill="#ef6b73">›</tspan>   not bypass schema compatibility.</text></g>
<g class="f38"><text x="18" y="59"><tspan fill="#8cc570" font-weight="700">$ </tspan>npx datocms content:diff "spring launch" --autogenerate=staging</text><text x="18" y="78">Comparing content from "staging" to "main"... FAILED!</text><text x="18" y="97"> <tspan fill="#ef6b73">›</tspan>   Error: Incompatible schema: cannot generate content migration "spring launch" from "staging" </text><text x="18" y="116"> <tspan fill="#ef6b73">›</tspan>   to "main" because their managed schemas differ.</text><text x="18" y="135"> <tspan fill="#ef6b73">›</tspan>   No content records were read and no migration artifacts were created.</text><text x="18" y="154"> <tspan fill="#ef6b73">›</tspan>   Generate the schema migration first:</text><text x="18" y="173"> <tspan fill="#ef6b73">›</tspan>     datocms migrations:new "sync staging schema" --autogenerate="staging:main"</text><text x="18" y="192"> <tspan fill="#ef6b73">›</tspan>   Apply it to a fork of the destination:</text><text x="18" y="211"> <tspan fill="#ef6b73">›</tspan>     datocms migrations:run --source="main" --destination="main-schema-ready"</text><text x="18" y="230"> <tspan fill="#ef6b73">›</tspan>   Then regenerate the content diff against that schema-ready fork:</text><text x="18" y="249"> <tspan fill="#ef6b73">›</tspan>     datocms content:diff "spring launch" --autogenerate="staging:main-schema-ready"</text><text x="18" y="268"> <tspan fill="#ef6b73">›</tspan>   --migrate-invalid-content only handles supported invalid or historical-null content; it does </text><text x="18" y="287"> <tspan fill="#ef6b73">›</tspan>   not bypass schema compatibility.</text><text x="18" y="306"><tspan fill="#8cc570" font-weight="700">$ </tspan></text></g>
